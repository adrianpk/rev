[package]
name = "rev"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[[example]]
name = "source-check"
test = true

[dependencies]
crossterm = "=0.29.0"
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
tree-sitter = "=0.27.1"
tree-sitter-loader = { version = "=0.27.0", default-features = false, features = ["tree-sitter-tags"] }
tree-sitter-rust = "=0.24.2"
tree-sitter-c = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tree-sitter-python = "=0.25.0"
