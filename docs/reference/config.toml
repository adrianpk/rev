# rev startup configuration reference, schema 1.
# Every active value below is a compiled default. Omitted leaves also use defaults.
# The comments below describe supported types, bounds and optional examples.
# Retain or change the values you need; restart the editor to apply changes.
# All paths are literal. No shell expansion or implicit project config is used.

# Integer schema version; only 1 is accepted. Omission also means 1.
version = 1
# Array of local paths, loaded depth-first in order before this source's leaves.
include = []
# Optional includes: replace the top-level include array after creating these files.
# include = ["editing.toml", "colors.toml"]

[editor]
# "spaces" or "tabs"; global policy, overridable per language.
indent_style = "spaces"
# Integer 1..=32 display columns between indentation stops.
indent_width = 4
# Integer 1..=32 display cells between literal-tab stops; does not rewrite bytes.
tab_width = 4

[scroll]
# Integer 0..=1000 overlapping rows per page; usable panes still advance one row.
page_overlap = 2

[windows]
# Finite float 0.1..=0.9; preferred first-child share after the split separator.
split_ratio = 0.5

[gutter]
# Boolean; initial per-view number visibility, subject to narrow-pane geometry.
visible = true
# "absolute" or "relative" logical line calculation.
mode = "absolute"
# "absolute", "zero" or "hidden" current-line label, independent of mode.
current_line = "absolute"
# "left" or "right" of the editing text.
side = "left"
# Integer 1..=20 minimum digits; complete source labels are never truncated.
minimum_digits = 4
# Integer 0..=4 terminal cells on either side of the number digits.
left_padding = 0
right_padding = 1

[mouse]
# Boolean; native pointer reporting at startup; M-x mouse-mode toggles this session.
enabled = true
# Integer 1..=100 logical rows per wheel report; drag steps also clamp to text height.
scroll_lines = 3

[minibuffer]
# Integer 1..=32 candidate rows, clipped to the available terminal geometry.
candidate_limit = 8
# Command matching: "prefix-then-substring", "prefix" or "substring".
# Path matching remains literal case-sensitive component-prefix matching.
match = "prefix-then-substring"
# Integer 1..=4096 distinct accepted M-x names retained in this session.
history_limit = 128
# Integer 1..=65536 Unicode scalars per prompt; excess input rejects atomically.
input_limit = 4096

[history]
# Integer 1..=65536 complete undo/redo groups per buffer.
group_limit = 512
# Integer 1..=1073741824 logical payload bytes; soft target, not resident memory.
# The newest coherent group remains even if it alone exceeds this target.
payload_target_bytes = 67108864

[kill_ring]
# Integer 1..=4096 retained linear entries; rectangles have a separate store.
capacity = 32
# Boolean; join consecutive compatible directional kills into one entry.
coalesce = true

[tree]
# Boolean; initial visibility. Tiny/narrow terminals can hide the pane.
visible = false
# Integer 1..=512 preferred columns, subject to editor and terminal minima.
width = 24
# Finite float 0.1..=0.5 maximum terminal-width share.
max_fraction = 0.3333333333333333
# "auto", "cwd" or "file-parent"; see defaults.md for initial-root behavior.
root = "auto"
# Boolean; include dot-prefixed entries in tree observations.
show_hidden = true
# Boolean; sort directories before leaves, then names by bytes.
directories_first = true

[org]
# Native Org availability; M-x org-mode selects it explicitly per buffer.
enabled = true

[org.time]
# local honors TZ; system uses localtime; UTC or a relative IANA name overrides TZ.
zone = "local"
# Require an observed offset for folds and a valid replacement local time for gaps.
ambiguous = "prompt"
nonexistent = "prompt"

[org.priority]
# Ordered single uppercase A-Z characters; highest <= default <= lowest.
highest = "A"
lowest = "C"
default = "B"

[org.duration.units]
# Positive finite elapsed work minutes; source-local text cannot change scales.
min = 1.0
h = 60.0
d = 1440.0
w = 10080.0
m = 43200.0
y = 525960.0

[org.todo]
# Ordered 1..64 unique keywords; finished must be a subset. Source TODO,
# SEQ_TODO and TYP_TODO declarations override the workflow for that buffer.
sequence = ["TODO", "DONE"]
finished = ["DONE"]
# Add CLOSED on completion; ordinary completion logging is off by default.
log_done = false
# Empty places state notes after planning/properties; otherwise 1..64 ASCII
# letters/digits/_/-, excluding PROPERTIES and END, selects a log drawer.
log_drawer = ""
# Refuse completion while a descendant task remains unfinished.
block_children = false

[org.tags]
# Boolean; include ancestor and FILETAGS membership without inserting text.
inherit = true

[org.properties]
# Up to 128 unique stored names (1..128 UTF-8 bytes each); empty disables inheritance.
# Names are case-insensitive; arrays replace on merge, including empty arrays.
inherit = []

[syntax]
# Boolean; enable the existing bundled grammar/query, with plain-text fallback.
enabled = true
# Integer 0..=1073741824 UTF-8 bytes; zero means no configured cutoff.
max_bytes = 0

[files]
# "lf" or "crlf"; creation default only, never conversion of existing files.
newline = "lf"
# Boolean; creation default for one leading UTF-8 BOM.
bom = false

[files.associations]
# Optional associations: uncomment entries below to override built-in recognition.
# "*.go" = "go"
# "Buildfile" = "go"

# Patterns are exact basenames or leading *.suffix; IDs start with [a-z],
# followed by [a-z0-9-]. Exact basename wins, then longest suffix; case matters.

# Tokyo Night night defaults. All 46 roles are active six-digit #RRGGBB strings.
# Terminal true-color/cursor support and NO_COLOR determine visible capability.
[palette]
background = "#1a1b26"          # Document and ordinary prompt background.
foreground = "#c0caf5"          # Document text and inherited tree text.
cursor = "#c0caf5"              # Terminal cursor color when supported.
selection = "#283457"           # Document/vertical candidate selection background.
selection_text = "#c0caf5"      # Selected document/candidate foreground.
search = "#3d59a1"              # Search-match background.
search_text = "#c0caf5"         # Search-match foreground.
status = "#16161e"              # Active status background.
status_text = "#a9b1d6"         # Active and inactive status foreground.
status_inactive = "#1a1b26"     # Inactive status background.
border = "#3b4261"              # Inactive split separator foreground.
border_active = "#7aa2f7"       # Active split separator foreground.
tree = "#16161e"                # Tree background.
tree_selected = "#283457"       # Selected tree entry background.
tree_selected_text = "#c0caf5"  # Selected tree entry foreground.
message = "#c0caf5"             # Normal echo/message foreground.
warning = "#e0af68"             # Warning foreground.
error = "#db4b4b"               # Error foreground.

[palette.syntax]
keyword = "#9d7cd8"
string = "#9ece6a"              # Strings and escapes.
comment = "#565f89"             # Comments and documentation comments.
type = "#2ac3de"                # Types and constructors.
function = "#7aa2f7"            # Functions, methods and macros.
number = "#ff9e64"              # Constants, booleans and numeric literals.
punctuation = "#89ddff"         # Grammar-captured punctuation and operators.

[palette.org]
heading = "#7aa2f7" # Heading lines.
keyword = "#9d7cd8" # Keywords and affiliated metadata.
drawer = "#2ac3de" # Drawer boundaries.
property = "#2ac3de" # Property entries.
planning = "#ff9e64" # Recognized planning lines.
block = "#9d7cd8" # Block boundaries.
code = "#9ece6a" # Literal source, examples, export and fixed-width text.
comment = "#565f89" # Comments and comment-block bodies.
list = "#89ddff" # List item markers.
table = "#89ddff" # Native table rows.
formula = "#ff9e64" # Table formula directives; never evaluated by coloring.
emphasis = "#9d7cd8" # Inline emphasis and its delimiters.
link = "#7aa2f7" # Link source.
target = "#2ac3de" # Ordinary and radio targets.
footnote = "#ff9e64" # Footnote objects.
entity = "#2ac3de" # Recognized entity source.
malformed = "#e0af68" # Malformed structural delimiters.

[palette.gutter]
background = "#1a1b26"          # Number-field background.
foreground = "#565f89"          # Ordinary logical labels.
current_line = "#7aa2f7"        # Current-line label, also emphasized without color.
separator = "#3b4261"           # One-cell number/text separator.

# Complete built-in maps follow. Use existing fixed command/action names only.
